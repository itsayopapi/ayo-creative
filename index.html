<!doctype html>
<html lang="en">
  <head>
    <!-- figma:head-start -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Fonts: preconnect + link (not CSS @import) for fastest first paint -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,700;0,9..144,900;1,9..144,300;1,9..144,700&family=Outfit:wght@300;400;500;600;700&display=swap" />

    <!-- Primary SEO -->
    <title>Ayo Creative Designs — Website Design & Development Agency | Lagos → Worldwide</title>
    <meta name="description" content="Ayo Creative Designs is a web design and development agency building conversion-focused websites for businesses in Nigeria and worldwide — landing pages, portfolios, business sites, e-commerce and custom web apps. Transparent fixed pricing from $300. Get a quote within 24 hours." />
    <meta name="keywords" content="web design agency, website design company, web development agency, UI UX design agency, e-commerce website design, SEO agency, responsive web design, web design Lagos, web design Nigeria, website agency near me, custom website design, professional website designer, React development agency, brand identity design" />
    <meta name="author" content="Ayo Creative Designs" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow" />
    <meta name="theme-color" content="#080808" />
    <meta name="rating" content="general" />
    <meta name="revisit-after" content="7 days" />
    <meta name="google-site-verification" content="1dirB63oWSpAyqH-vk3H91wyeZaRyWI5lgC_oSYCRAc" />
    <link rel="canonical" href="https://www.ayocreativedesigns.com/" />

    <!-- Hreflang for international SEO -->
    <link rel="alternate" hreflang="en" href="https://www.ayocreativedesigns.com/" />
    <link rel="alternate" hreflang="x-default" href="https://www.ayocreativedesigns.com/" />

    <!-- Favicon -->
    <link rel="icon" type="image/jpeg" href="/favicon.jpg" />
    <link rel="apple-touch-icon" href="/favicon.jpg" />
    <link rel="shortcut icon" href="/favicon.jpg" />

    <!-- Open Graph (Facebook / LinkedIn / WhatsApp) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ayo Creative Designs" />
    <meta property="og:title" content="Ayo Creative Designs — Websites That Generate Revenue" />
    <meta property="og:description" content="Web design & development agency serving clients in Nigeria and worldwide. Custom websites, e-commerce and UI/UX design that convert — transparent fixed pricing, hosting and domain never hidden." />
    <meta property="og:url" content="https://www.ayocreativedesigns.com/" />
    <meta property="og:image" content="https://www.ayocreativedesigns.com/favicon.jpg" />
    <meta property="og:image:alt" content="Ayo Creative Designs — Web Design Agency" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Ayo Creative Designs — Websites That Generate Revenue" />
    <meta name="twitter:description" content="Web design & development agency for Nigeria and the world. Custom websites, e-commerce and UI/UX design with transparent fixed pricing. Get a quote in 24 hours." />
    <meta name="twitter:image" content="https://www.ayocreativedesigns.com/favicon.jpg" />

    <!-- Geo tags (Lagos, Nigeria HQ) -->
    <meta name="geo.region" content="NG-LA" />
    <meta name="geo.placename" content="Lagos" />

    <!-- Structured data: Organization + LocalBusiness -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ProfessionalService",
      "name": "Ayo Creative Designs",
      "alternateName": "Ayo Creative",
      "description": "Premium web design and development agency building revenue-generating websites for businesses worldwide. UI/UX design, web development, e-commerce, SEO and brand strategy.",
      "url": "https://www.ayocreativedesigns.com/",
      "logo": "https://www.ayocreativedesigns.com/favicon.jpg",
      "image": "https://www.ayocreativedesigns.com/favicon.jpg",
      "email": "ayocoding12@gmail.com",
      "foundingLocation": { "@type": "Place", "name": "Lagos, Nigeria" },
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Lagos",
        "addressCountry": "NG"
      },
      "areaServed": [
        { "@type": "Country", "name": "Nigeria" },
        { "@type": "Country", "name": "United Kingdom" },
        { "@type": "Country", "name": "United States" },
        { "@type": "Country", "name": "United Arab Emirates" },
        { "@type": "Country", "name": "Singapore" }
      ],
      "sameAs": [
        "https://instagram.com/ayo.creative.designs",
        "https://linkedin.com/in/ayomidequdus"
      ],
      "priceRange": "$$",
      "knowsAbout": ["Web Design", "UI/UX Design", "Web Development", "E-Commerce", "SEO", "Brand Strategy", "Responsive Design"],
      "makesOffer": [
        { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Website Design & Development", "description": "Conversion-focused websites from $300 — landing pages, portfolios and business sites" } },
        { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "E-Commerce Development", "description": "Multi-currency, multilingual online stores" } },
        { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Brand Strategy & Identity", "description": "Positioning, logos and visual identity systems" } },
        { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "SEO Optimization", "description": "Technical, on-page and international SEO" } }
      ]
    }
    </script>

    <!-- figma:head-end -->
  </head>
  <body>
    <!-- figma:body-start -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

</html>
